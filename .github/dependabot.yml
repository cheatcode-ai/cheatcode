version: 2

# Scheduled version updates stay deliberately low-volume. Dependabot security
# updates remain enabled at repository level and are not constrained by these
# version-update pull-request limits.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      workspace:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directories:
      - /infra/containers/sandbox/app-generators
      - /infra/containers/sandbox/app-templates/expo
      - /infra/containers/sandbox/app-templates/next
      - /infra/containers/sandbox/browser-driver
      - /infra/containers/sandbox/doc-runtime
      - /infra/containers/sandbox/extension-overrides/parquet-viewer
      - /infra/containers/sandbox/package-manager
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      sandbox:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /infra/containers/sandbox
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    groups:
      sandbox-image:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /infra/containers/sandbox
    schedule:
      interval: monthly
      time: "05:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    groups:
      python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: numpy
        versions:
          - ">=2.4"
      - dependency-name: matplotlib
        versions:
          - ">=3.11"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
